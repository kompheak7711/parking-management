name: property-rental-management

services:
  postgres:
    image: postgres:17.6

    environment:
      POSTGRES_DB: prm
      POSTGRES_USER: prm_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_migration_password
      POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      POSTGRES_BACKUP_PASSWORD_FILE: /run/secrets/postgres_backup_password
      POSTGRES_RESTORE_PASSWORD_FILE: /run/secrets/postgres_restore_password
      POSTGRES_HUMAN_ADMIN_PASSWORD_FILE: /run/secrets/postgres_human_admin_password
      POSTGRES_BOOTSTRAP_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password

    secrets:
      - postgres_admin_password
      - postgres_migration_password
      - postgres_runtime_password
      - postgres_backup_password
      - postgres_restore_password
      - postgres_human_admin_password
      - postgres_bootstrap_password

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-identities.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prm_admin -d prm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?set POSTGRES_ADMIN_PASSWORD_FILE}
  postgres_migration_password:
    file: ${POSTGRES_MIGRATION_PASSWORD_FILE:?set POSTGRES_MIGRATION_PASSWORD_FILE}
  postgres_runtime_password:
    file: ${POSTGRES_RUNTIME_PASSWORD_FILE:?set POSTGRES_RUNTIME_PASSWORD_FILE}
  postgres_backup_password:
    file: ${POSTGRES_BACKUP_PASSWORD_FILE:?set POSTGRES_BACKUP_PASSWORD_FILE}
  postgres_restore_password:
    file: ${POSTGRES_RESTORE_PASSWORD_FILE:?set POSTGRES_RESTORE_PASSWORD_FILE}
  postgres_human_admin_password:
    file: ${POSTGRES_HUMAN_ADMIN_PASSWORD_FILE:?set POSTGRES_HUMAN_ADMIN_PASSWORD_FILE}
  postgres_bootstrap_password:
    file: ${POSTGRES_BOOTSTRAP_PASSWORD_FILE:?set POSTGRES_BOOTSTRAP_PASSWORD_FILE}
