name: property-rental-management

services:
  postgres:
    image: postgres:17.6

    environment:
      POSTGRES_DB: prm
      POSTGRES_USER: prm_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-identities.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prm_admin -d prm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
